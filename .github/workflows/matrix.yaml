name: Matrix Workflow

on:
    push:
    workflow_dispatch:

jobs:
    deploy:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                images: [hello-world, alpine]
                exclude:
                  - images: alpine
                    os: windows
        runs-on: ${{ matrix.os }}
        steps:
        - name: Echo Docker Details
          run: docker info
          
        - name: Run Image on ${{ matrix.os }}
          run: docker run ${{ matrix.images }}
